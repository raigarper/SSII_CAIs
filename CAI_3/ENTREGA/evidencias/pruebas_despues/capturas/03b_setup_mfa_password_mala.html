<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configurar FreeOTP - rocio</title>
</head>
<body>
    <h2>1. Vincula tu dispositivo con FreeOTP</h2>

    <p>
        Seleccionar cuenta:
        <a href="/setup-mfa?user=rocio"><button type="button">Rocio (Paciente)</button></a>
        <a href="/setup-mfa?user=dr_gasca"><button type="button">Dr. Gasca (Médico)</button></a>
    </p>

    <p>Configurando autenticación para el usuario: <strong>rocio</strong></p>

    
        <p style="color: red;"><strong>Error:</strong> Contraseña incorrecta. No se puede mostrar el código QR.</p>
    

    
        <!--
          FIX RT-02: antes este endpoint mostraba el QR y el secreto TOTP de
          CUALQUIER usuario sin pedir ninguna credencial. Ahora se exige la
          contraseña del propio usuario antes de generar el QR.
        -->
        <p>Introduce tu contraseña para generar el código QR de vinculación:</p>
        <form method="post" action="/setup-mfa?user=rocio" autocomplete="off">
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" required autocomplete="new-password" autofocus><br><br>
            <button type="submit">Mostrar código QR</button>
        </form>
    
</body>
</html>
