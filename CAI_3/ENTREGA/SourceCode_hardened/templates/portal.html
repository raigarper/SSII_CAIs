<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Médico</title>
</head>
<body>
    <!-- FIX RT-05: el nombre de usuario ya no se lee con JS desde la cookie
         (que ahora es HttpOnly); lo inyecta el propio servidor Flask. -->
    <h2>Portal Médico {% if username %}({{ username }}){% endif %}</h2>
    <p>1. Vincular FreeOTP: <a id="link-mfa" href="http://localhost:8000/setup-mfa" target="_blank">Configurar FreeOTP</a></p>
    <p>
        2. Autenticarse: <a href="/login"><strong>Iniciar sesión con OAuth 2.0 + FreeOTP</strong></a> |
        <!-- FIX RT-08: logout por POST (antes era un enlace GET, vulnerable
             a CSRF trivial: cualquier <img src="/logout"> cerraba la sesion). -->
        <form method="post" action="/logout" style="display:inline">
            <button type="submit" style="border:none;background:none;color:blue;text-decoration:underline;cursor:pointer;padding:0;font:inherit;">Cerrar sesión</button>
        </form>
    </p>
    <hr>

    <h3>Operaciones de API</h3>
    <button id="btn-leer">Leer Historial (GET)</button>
    <br><br>

    <div>
        <input type="text" id="nuevo-diagnostico" placeholder="Escribe nuevo diagnóstico..." size="35">
        <button id="btn-modificar">Modificar Historial (POST)</button>
    </div>
    <br>

    <button id="btn-cookies">Inspeccionar Cookies desde JS</button>
    <pre id="resultado" style="background:#f4f4f4; padding:12px; margin-top:12px; border:1px solid #ccc;">Esperando acción...</pre>

    <!-- FIX CODE-07: script externo (no inline) para funcionar correctamente
         con la cabecera Content-Security-Policy: default-src 'self'. -->
    <script src="/static/portal.js"></script>
</body>
</html>
